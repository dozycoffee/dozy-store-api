# local(default) — 프로파일 미지정 시. spring-boot-docker-compose가 compose.yaml의 postgres 컨테이너를
# 자동 기동/탐지해 R2DBC ConnectionFactory 빈을 구성하므로 여기엔 접속 정보를 두지 않는다.
# 개인용 오버라이드가 필요하면 application-local.yaml(.gitignore 처리됨)을 만들어 사용할 것.
spring:
  application:
    name: dozy-store-api
  r2dbc:
    # 커넥션 풀(r2dbc-pool). Exposed 트랜잭션 하나가 연결 하나를 빌려 쓰고 끝나면 돌려준다.
    # 운영 규모가 정해지면 max-size를 다시 정한다. PostgreSQL max_connections를 인스턴스 수 × max-size보다 크게 둔다.
    pool:
      initial-size: 2
      max-size: 10
      max-idle-time: 10m

management:
  endpoints:
    web:
      exposure:
        include: health, info

# 토큰 검증은 dozy-auth 스타터가 맡는다(docs/architecture/tech-stack.md 인증 설정, docs/api/README.md 경로와 인가).
# Store는 본사 직원·서비스 계정(realm internal)과 점주(realm partner)의 토큰을 받는다.
dozy:
  auth:
    audience: store
    accepted-realms: [internal, partner]
    # Auth 주소. 허용 issuer는 {base}/realms/{realm}, JWKS는 {base}/.well-known/jwks.json.
    # 기본값은 dozy-auth를 로컬로 띄웠을 때의 주소다. JWKS는 첫 요청 때 받으므로 Auth 없이도 앱은 뜬다.
    issuer-base-uri: ${DOZY_AUTH_ISSUER_BASE_URI:http://localhost:8080}
    # k8s·로드밸런서 프로브와 손님 API는 토큰 없이 허용한다. 그 밖의 모든 요청은 토큰이 필요하다.
    public-paths: [/actuator/health, /actuator/health/**, /api/v1/public/**]
    # Catalog 호출용 system token 클라이언트(dozySystemWebClient). Store의 서비스 계정 id·secret이 있어야 켤 수 있어,
    # Catalog 호출을 구현할 때 켠다(docs/architecture/integration.md).

store:
  # 업무 기준 시간대. 개점일·폐점일의 "오늘"을 이 시간대로 해석한다. 서버·JVM·DB 시간대는 UTC로 둔다.
  business-zone: Asia/Seoul

---
spring:
  config:
    activate:
      on-profile: prod
  docker:
    compose:
      enabled: false
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  # Flyway는 R2DBC를 지원하지 않아 앱 시작 시 JDBC로 한 번 실행된다. 로컬·테스트는 docker-compose와
  # Testcontainers가 JDBC 연결 정보를 자동으로 주지만, prod는 R2DBC와 같은 환경 변수로 직접 지정한다.
  flyway:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    user: ${DB_USERNAME}
    password: ${DB_PASSWORD}
dozy:
  auth:
    # 운영은 기본값을 쓰지 않고 반드시 지정한다.
    issuer-base-uri: ${DOZY_AUTH_ISSUER_BASE_URI}
